version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: username_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: usernamedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usernamedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - username_net

  redis:
    image: redis:7-alpine
    container_name: username_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - username_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: username_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/usernamedb"
      REDIS_URL: "redis://redis:6379"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      JWT_SECRET: "${JWT_SECRET:-production-ready-jwt-secret-min-32-chars-long-secure-key}"
      AI_PROVIDER: "${AI_PROVIDER:-mock}"
      AI_MODEL: "${AI_MODEL:-mock-model}"
      AI_FALLBACK_PROVIDER: "${AI_FALLBACK_PROVIDER:-mock}"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80,https://web.telegram.org"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - username_net

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: username_bot
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      API_BASE_URL: "http://api:4000"
      TELEGRAM_MINIAPP_URL: "${TELEGRAM_MINIAPP_URL:-http://localhost:5173}"
    networks:
      - username_net

  miniapp:
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
    container_name: username_miniapp
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - username_net

volumes:
  postgres_data:
  redis_data:

networks:
  username_net:
    driver: bridge